<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>partits. Club Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FCFCFD; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-lg w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-gray-900">partits<span class="text-orange-500">.</span> Club</h1>
      <p class="text-gray-500 mt-2">Suscripción grupal para clubes de baloncesto</p>
    </div>

    <div class="flex justify-center gap-3 mb-6">
      <button id="btn-monthly" onclick="setPlan('monthly')"
        class="px-5 py-2 rounded-full text-sm font-bold border-2 border-orange-500 bg-orange-500 text-white transition-all">
        Mensual
      </button>
      <button id="btn-yearly" onclick="setPlan('yearly')"
        class="px-5 py-2 rounded-full text-sm font-bold border-2 border-gray-300 text-gray-500 transition-all">
        Anual (−20%)
      </button>
    </div>

    <div id="tiers" class="flex flex-col gap-4 mb-6"></div>

    <p id="error-msg" class="text-red-500 text-sm text-center hidden mb-2"></p>
    <p class="text-xs text-gray-400 text-center">Cancela cuando quieras. Sin compromisos.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('uid');
    const clubId = params.get('clubId');
    const currentTier = params.get('tier') || '';
    let activePlan = params.get('plan') || 'monthly';

    const TIERS = [
      { key: 'small',  label: 'Club Small',  members: 10, monthly: 9.99,  yearly: 95.99  },
      { key: 'medium', label: 'Club Medium', members: 20, monthly: 17.99, yearly: 172.99 },
      { key: 'large',  label: 'Club Large',  members: 30, monthly: 24.99, yearly: 239.99 },
    ];

    function setPlan(plan) {
      activePlan = plan;
      document.getElementById('btn-monthly').className = `px-5 py-2 rounded-full text-sm font-bold border-2 transition-all ${plan === 'monthly' ? 'border-orange-500 bg-orange-500 text-white' : 'border-gray-300 text-gray-500'}`;
      document.getElementById('btn-yearly').className  = `px-5 py-2 rounded-full text-sm font-bold border-2 transition-all ${plan === 'yearly'  ? 'border-orange-500 bg-orange-500 text-white' : 'border-gray-300 text-gray-500'}`;
      renderTiers();
    }

    function renderTiers() {
      const container = document.getElementById('tiers');
      container.innerHTML = TIERS.map(t => {
        const price = activePlan === 'yearly' ? t.yearly : t.monthly;
        const isCurrent = t.key === currentTier;
        return `
          <div class="bg-white rounded-2xl border-2 ${isCurrent ? 'border-orange-500' : 'border-gray-200'} p-5 shadow-sm">
            <div class="flex justify-between items-center mb-3">
              <div>
                <span class="font-black text-lg text-gray-900">${t.label}</span>
                ${isCurrent ? '<span class="ml-2 bg-orange-100 text-orange-600 text-xs font-bold px-2 py-0.5 rounded-full">Actual</span>' : ''}
              </div>
              <div class="text-right">
                <p class="font-black text-xl text-gray-900">€${price.toFixed(2)}<span class="text-sm font-normal text-gray-400">/${activePlan === 'yearly' ? 'año' : 'mes'}</span></p>
              </div>
            </div>
            <p class="text-sm text-gray-500 mb-4">Admin + hasta ${t.members} entrenadores</p>
            <button onclick="subscribe('${t.key}')" id="btn-tier-${t.key}"
              class="w-full py-3 rounded-xl font-bold text-sm transition-colors ${isCurrent ? 'bg-gray-100 text-gray-500 cursor-default' : 'bg-gray-900 hover:bg-gray-800 text-white'}">
              ${isCurrent ? 'Plan actual' : 'Seleccionar'}
            </button>
          </div>`;
      }).join('');
    }

    async function subscribe(tier) {
      if (tier === currentTier) return;
      const btn = document.getElementById(`btn-tier-${tier}`);
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Cargando...';
      document.getElementById('error-msg').classList.add('hidden');

      try {
        const res = await fetch(
          'https://europe-west3-basketmanager-ed370.cloudfunctions.net/createClubCheckoutSession',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, clubId, tier, plan: activePlan }),
          }
        );
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'Error desconocido');
        }
      } catch (e) {
        document.getElementById('error-msg').textContent = 'Error: ' + e.message;
        document.getElementById('error-msg').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Seleccionar';
      }
    }

    setPlan(activePlan);
  </script>
</body>
</html>
